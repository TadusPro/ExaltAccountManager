[package]
name = "daily_auto_login"
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
reqwest = { version = "0.13", features = ["blocking", "form"] }
lazy_static = "1.5.0"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
roxmltree = "0.21"
tokio = { version = "1.52", features = ["full"] }
wmi = "0.18.4"
sha1 = "0.11"
uuid = "1.23"
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }
sysinfo = "0.39"
eam_commons = { path = "../eam_commons" }